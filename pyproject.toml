[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "glyphflip"
version = "0.1.0"
description = "Feed it an image, get back the translated text. OCR + hybrid translation CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Martin Synek" }]
keywords = ["ocr", "translation", "cli", "paddleocr", "rapidocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Linguistic",
]

# --- core: everything the CLI needs for its happy path ----------------------
# rapidocr-onnxruntime = PP-OCR detection/recognition models served via
# onnxruntime (no paddlepaddle runtime dependency) -> bundles cleanly.
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "rapidocr>=3,<4",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
# full PaddleOCR pipeline on the GPU (better accuracy on hard scans)
gpu = [
    "paddleocr>=2.7",
    "paddlepaddle-gpu>=2.6",
]
# local translation models (opus-mt family, CC-BY 4.0 / Apache-compatible)
local = [
    "torch>=2.2",
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
]
# packaging into one distributable artifact
build = [
    "pyinstaller>=6",
    "nuitka>=2",
]
# development
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
gf = "glyphflip.cli:main"

# --- tooling config lives here so we keep the file count low -----------------

[tool.hatch.build.targets.wheel]
packages = ["src/glyphflip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download or run real models (deselect with '-m \"not slow\"')",
    "network: tests that hit external services",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

